name: Build macOS .dmg

# 触发方式：
#   1. 手动：仓库 Actions → Build macOS .dmg → Run workflow
#   2. 推送 main（或 macOS-intel-build）及打 v* tag 自动触发
on:
  workflow_dispatch:
  push:
    branches: ["main", "macOS-intel-build"]
    tags: ["v*"]

jobs:
  build-macos:
    # ------------------------------------------------------------------
    # 单一 workflow 覆盖两条发行线，架构按「仓库名」自动判定：
    #   - 仓库名含 Apple_Silicon（at_xiao_pp_MacOS_Apple_Silicon_Version）
    #     → arm64 纯血原生：macos-15 runner 本身就是 Apple Silicon，
    #       setup-python 装的也是原生 arm64 Python，**不加 arch -x86_64 包裹**，
    #       产物 M 系列直接原生运行，无 Rosetta 2 翻译层（启动更快、排障不用穿翻译层）。
    #       注意：arm64 包在 Intel Mac 上会报 "bad CPU type"，该仓库只面向 Apple Silicon。
    #   - 其余仓库（Intel 兼容线）→ x86_64：全程 arch -x86_64 包裹（走 Rosetta 2），
    #       单包覆盖 Intel 原生 + M 系列经 Rosetta 2 运行。
    # ------------------------------------------------------------------
    runs-on: macos-15
    env:
      ATPP_TARGET_ARCH: ${{ contains(github.repository, 'Apple_Silicon') && 'arm64' || 'x86_64' }}
      # x86_64 线需要 Rosetta 2 才能在 arm64 机器上进行交叉构建
      USE_ROSETTA: ${{ contains(github.repository, 'Apple_Silicon') && '0' || '1' }}
      ARTIFACT_SUFFIX: ${{ contains(github.repository, 'Apple_Silicon') && 'arm64' || 'intel' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rosetta 2 (仅 x86_64 交叉构建需要)
        if: env.USE_ROSETTA == '1'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build .dmg
        run: |
          set -e
          # arm64 线：直接跑（原生）；x86_64 线：整条链路用 arch -x86_64 包裹（Rosetta 2）
          if [ "$USE_ROSETTA" = "1" ]; then
            ARCH_PREFIX="arch -x86_64"
          else
            ARCH_PREFIX=""
          fi
          echo "=== 目标架构: $ATPP_TARGET_ARCH（rosetta=$USE_ROSETTA）==="
          $ARCH_PREFIX python -m pip install --upgrade pip
          $ARCH_PREFIX pip install -r requirements-macos.txt
          $ARCH_PREFIX python scripts/package_macos.py --clean

      - name: Verify architecture
        run: |
          echo "=== 期望架构: $ATPP_TARGET_ARCH ==="
          lipo -info "dist/AT小PP.app/Contents/MacOS/AT小PP" || true
          echo "=== dmg 产物 ==="
          ls -lh release/AT小PP-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AT小PP-macos-${{ env.ARTIFACT_SUFFIX }}
          path: release/AT小PP-macos.dmg
          if-no-files-found: error
